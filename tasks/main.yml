---
- include_tasks:        'tasks/common/user_groups.yml'
- include_tasks:        'tasks/common/users.yml'
- include_tasks:        'tasks/common/dpkg_i386_architecture.yml'
- include_tasks:        'tasks/common/install_packages.yml'
- include_tasks:        'tasks/common/install_package_files.yml'
- include_tasks:        'tasks/common/create_files.yml'
- include_tasks:        'tasks/common/template_files.yml'
- include_tasks:        'tasks/common/install_files.yml'
- include_tasks:        'tasks/common/symlinks.yml'
- lineinfile:
    state:              'present'
    line:               '  /usr/local/share/print_target/** rw,'
    regexp:             '/usr/local/share/print_target/'
    insertafter:        '/var/spool/cups-pdf/'
    dest:               '/etc/apparmor.d/usr.sbin.cupsd'
  register:             apparmor_result
- include_tasks:        'tasks/common/restart_services.yml'
  when:                 install_packages_result.changed
                        or install_package_files_result.changed
                        or create_files_result.changed
                        or template_files_result.changed
                        or install_files_result.changed 
                        or symlinks_result.changed
                        or apparmor_result.changed
- include_tasks:        'tasks/common/enable_services.yml'
- include_tasks:        'tasks/common/start_services.yml'
- include_tasks:        'tasks/common/shell_commands_ignore_change.yml'
